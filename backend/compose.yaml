services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Create backend/.env first}
      POSTGRES_USER: ${POSTGRES_USER:?Create backend/.env first}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Create backend/.env first}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - aji_tstaji_backend_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  aji_tstaji_backend_pgdata:

